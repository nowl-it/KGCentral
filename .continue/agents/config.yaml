name: AI Local Pi 4 - Qwen Coder
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5-Coder 7B (Pi 4)
    provider: ollama
    apiBase: http://nowl-rpi4.local:11434   # <-- quan trọng nhất
    model: qwen2.5-coder-stable
    roles:
      - chat
      - edit
      - apply
      - autocomplete   # dùng chung luôn cho vibe coding mượt
    defaultCompletionOptions:
      temperature: 0.7
      maxTokens: 2048
      keepAlive: 3600   # giữ model load lâu hơn, giảm lag
    requestOptions:
      timeout: 180